<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Guess Who Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MODE SELECT SCREEN -->
<div id="mode-screen" class="mode-screen">
  <h1>Choose Mode</h1>
  <button onclick="startGame('kids')">Kids Mode 👶</button>
  <button onclick="startGame('adult')">Adult Mode 😎</button>
</div>

<!-- GAME SCREEN (hidden initially) -->
<div id="game" class="game" style="display:none;">

  <h1 id="name"></h1>

  <img id="answer-image" src="" />

  <div id="image-container">
    <img id="image" src="" />
  </div>

  <div id="clues"></div>
  <button onclick="goToMenu()" class="back-btn">⬅ Back to Menu</button>
  <button onclick="skip()">⏭ Skip</button>

  <button onclick="nextStep()">Next</button>

</div>

<script src="script.js"></script>
</body>
</html>
